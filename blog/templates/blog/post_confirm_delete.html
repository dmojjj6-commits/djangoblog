{% extends "blog/base.html" %}
{% block content %}
<h2>Delete "{{ post.title }}"?</h2>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Yes, delete</button>
  <a class="btn btn-secondary" href="{% url 'post_detail' post.slug %}">Cancel</a>
</form>
{% endblock %}
